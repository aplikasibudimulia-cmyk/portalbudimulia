    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <script>
      // 1. Inisialisasi Font
      const savedFont = localStorage.getItem('app_font');
      if (savedFont === 'ubuntu') document.documentElement.classList.add('font-ubuntu');
      if (savedFont === 'bricolage') document.documentElement.classList.add('font-bricolage');

      // 2. Proteksi Kebal Google Translate / Ekstensi Peramban (Mencegah NotFoundError: removeChild)
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) {
            if (console && console.warn) console.warn('[DOM Patch] Prevented NotFoundError: removeChild on modified node.');
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (console && console.warn) console.warn('[DOM Patch] Prevented NotFoundError: insertBefore on modified node.');
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>
  </head>
  <body class="notranslate" translate="no">
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
