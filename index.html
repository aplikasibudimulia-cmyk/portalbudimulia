<!doctype html>
<html lang="id" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" id="app-viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Auto-Fit Viewport untuk HP dengan layar kecil atau Ukuran Tampilan (Display Zoom) Besar (< 360px)
      (function () {
        try {
          var sw = Math.min(window.screen && window.screen.width ? window.screen.width : 9999, window.innerWidth || 9999);
          if (sw > 0 && sw < 360) {
            var scale = (sw / 360).toFixed(4);
            var vp = document.getElementById('app-viewport');
            if (vp) {
              vp.setAttribute(
                'content',
                'width=360, initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=' + scale + ', user-scalable=no, viewport-fit=cover'
              );
            }
          }
        } catch (e) {}
      })();
    </script>
    <title>eBudiMulia - Sistem Informasi Akademik Digital</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script>
      // 1. Inisialisasi Font
      const savedFont = localStorage.getItem('app_font');
      if (savedFont === 'ubuntu') document.documentElement.classList.add('font-ubuntu');
      if (savedFont === 'bricolage') document.documentElement.classList.add('font-bricolage');

      // 2. Proteksi Kebal Google Translate / Ekstensi Peramban (Mencegah NotFoundError: removeChild)
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) {
            if (console && console.warn) console.warn('[DOM Patch] Prevented NotFoundError: removeChild on modified node.');
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (console && console.warn) console.warn('[DOM Patch] Prevented NotFoundError: insertBefore on modified node.');
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>

  <body class="notranslate" translate="no">
    <div id="root" class="notranslate" translate="no">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <img src="/logo.png" alt="eBudiMulia" style="width:72px;height:72px;object-fit:contain;animation:ebmPulse 1.4s ease-in-out infinite;" />
        <div style="margin-top:16px;width:110px;height:3px;background:#e2e8f0;border-radius:999px;overflow:hidden;position:relative;">
          <div style="width:40%;height:100%;background:#4f46e5;border-radius:999px;position:absolute;animation:ebmBar 1.2s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes ebmPulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.88;transform:scale(0.97);} }
          @keyframes ebmBar { 0%{left:-40%;} 50%{left:40%;} 100%{left:100%;} }
        </style>
      </div>
    </div>
